<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0F1D19" />
    <meta name="robots" content="noindex" />
    <title>Hors connexion · PastFolio</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        background: #0f1d19;
        color: #efe6d2;
        font-family: Georgia, 'Times New Roman', serif;
        text-align: center;
      }
      main {
        max-width: 420px;
      }
      img {
        width: 96px;
        height: 96px;
      }
      .label {
        margin: 24px 0 8px;
        font: 600 11px/1.4 system-ui, sans-serif;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: #c9a45c;
      }
      h1 {
        margin: 0;
        font-size: 30px;
        font-weight: 600;
      }
      p {
        color: #a9a08c;
        font: 15px/1.6 system-ui, sans-serif;
      }
      hr {
        width: 64px;
        margin: 28px auto;
        border: 0;
        border-top: 1px solid rgba(201, 164, 92, 0.4);
      }
      button {
        margin-top: 8px;
        min-height: 44px;
        padding: 0 24px;
        border: 1px solid rgba(244, 216, 145, 0.6);
        border-radius: 4px;
        background: #c9a45c;
        color: #0f1d19;
        font: 600 13px system-ui, sans-serif;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="PastFolio" />
      <p class="label">Ligne télégraphique coupée</p>
      <h1>La corbeille est injoignable</h1>
      <p>Vous êtes hors connexion. Vos parties vous attendent : elles reprendront dès le retour du réseau.</p>
      <hr />
      <p class="label" lang="en">Telegraph line down</p>
      <p lang="en">You are offline. Your games are waiting and will resume as soon as the network is back.</p>
      <button type="button" onclick="location.reload()">Réessayer · Retry</button>
    </main>
  </body>
</html>
